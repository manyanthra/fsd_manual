<!DOCTYPE html>
<html lang="en">
<head>
    <style> :root { --bs-primary: #6f42c1; --bs-primary-rgb: 111,66,193; } </style> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Document</title>
</head>
<body>
    <form class="row g-3 needs-validation" novalidate id="contactForm"> 
  <div class="col-md-6"> 
    <label class="form-label">Name</label> 
    <input type="text" class="form-control" required> 
    <div class="invalid-feedback">Name is required.</div>   </div> 
  <div class="col-md-6"> 
    <label class="form-label">Email</label> 
    <input type="email" class="form-control" required> 
    <div class="invalid-feedback">Enter a valid email.</div>   </div> 
  <div class="col-12"> 
    <button class="btn btn-primary" type="submit">Send Message</button>   </div> 
</form> 
  <script> 
document.getElementById('contactForm').addEventListener('submit', function (e) {   if (!this.checkValidity()) {     e.preventDefault(); 
    e.stopPropagation();   } 
  this.classList.add('was-validated'); 
}); 
</script> 

</body>
</html>
